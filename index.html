<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mara – English Complete Offline Dictionary &amp; Reference</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-alt: #faf8f4;
      --text: #1b1e23;
      --muted: #5c6370;
      --accent: #1d4ed8;
      --accent-soft: #eef2ff;
      --border: #e2dfd7;
      --chip-bg: #f1efe9;
      --shadow: 0 2px 10px rgba(27, 30, 35, 0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .stats {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1 1 240px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 36px 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-alt);
      color: var(--text);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }

    .clear-btn.visible {
      display: block;
    }

    select {
      padding: 10px 12px;
      font-size: 0.92rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-alt);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .diacritic-bar {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .diacritic-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-right: 2px;
    }

    .char-btn {
      border: 1px solid var(--border);
      background: var(--chip-bg);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .char-btn:active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    main {
      max-width: 1020px;
      margin: 16px auto 44px;
      padding: 0 16px;
    }

    .section-panel {
      display: none;
    }

    .section-panel.active {
      display: block;
    }

    .entries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }

    .stack-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .mara-word {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-word;
    }

    .pos-badge {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--chip-bg);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .english-word {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
    }

    .meta-line {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .notes {
      font-size: 0.84rem;
      color: var(--muted);
      border-top: 1px dashed var(--border);
      padding-top: 6px;
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    @media (max-width: 600px) {
      .entries-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="title-row">
        <h1>Mara – English Complete Offline Reference</h1>
        <div class="stats" id="statsText">Loading...</div>
      </div>

      <div class="tabs" role="tablist" aria-label="Dictionary sections">
        <button type="button" class="tab-btn active" data-tab="dictionary">Word Dictionary</button>
        <button type="button" class="tab-btn" data-tab="translations">Translations &amp; Examples</button>
        <button type="button" class="tab-btn" data-tab="grammar">Grammar &amp; Verb Stems</button>
        <button type="button" class="tab-btn" data-tab="reih">Reih Machâpa &amp; Biephôh</button>
      </div>

      <div class="controls">
        <div class="search-box">
          <input
            type="search"
            id="searchInput"
            placeholder="Search across Mara, English, grammar, idioms..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" class="clear-btn" id="clearBtn" title="Clear search">&times;</button>
        </div>

        <select id="posFilter" aria-label="Filter by part of speech">
          <option value="ALL">All Categories</option>
        </select>

        <select id="directionFilter" aria-label="Search direction">
          <option value="BOTH">Mara &amp; English</option>
          <option value="MARA">Mara only</option>
          <option value="ENGLISH">English only</option>
        </select>
      </div>

      <div class="diacritic-bar">
        <span class="diacritic-label">Insert Mara char:</span>
        <button type="button" class="char-btn" data-char="â">â</button>
        <button type="button" class="char-btn" data-char="ô">ô</button>
        <button type="button" class="char-btn" data-char="y">y</button>
      </div>
    </div>
  </header>

  <main>
    <section id="panel-dictionary" class="section-panel active">
      <div class="entries-grid" id="dictionaryGrid"></div>
      <div class="empty-state" id="empty-dictionary" style="display: none;">No matching dictionary entries found.</div>
    </section>

    <section id="panel-translations" class="section-panel">
      <div class="stack-list" id="translationsList"></div>
      <div class="empty-state" id="empty-translations" style="display: none;">No matching translations or examples found.</div>
    </section>

    <section id="panel-grammar" class="section-panel">
      <div class="stack-list" id="grammarList"></div>
      <div class="empty-state" id="empty-grammar" style="display: none;">No matching grammar rules or verb stem notes found.</div>
    </section>

    <section id="panel-reih" class="section-panel">
      <div class="stack-list" id="reihList"></div>
      <div class="empty-state" id="empty-reih" style="display: none;">No matching Reih machâpa or Biephôh entries found.</div>
    </section>
  </main>

  <script>
    (function () {
      const payload = JSON.parse(document.getElementById("full-mara-data").textContent);

      // Deduplicate dictionary entries while preserving order
      const seenDict = new Set();
      const dictionary = [];
      for (const item of (payload.dictionary || [])) {
        const key = `${(item.en || "").toLowerCase()}||${(item.mr || "").toLowerCase()}||${(item.pos || "").toLowerCase()}||${(item.notes || "").toLowerCase()}`;
        if (!seenDict.has(key)) {
          seenDict.add(key);
          dictionary.push({
            en: item.en || "",
            mr: item.mr || "",
            pos: item.pos || "",
            notes: item.notes || ""
          });
        }
      }

      const appTranslations = payload.app_translations || [];
      const translationsExamples = payload.translations_examples || [];
      const grammar = payload.grammar || [];
      const reihMachapaBiephoh = payload.reih_machapa_biephoh || [];

      let activeTab = "dictionary";

      const searchInput = document.getElementById("searchInput");
      const clearBtn = document.getElementById("clearBtn");
      const posFilter = document.getElementById("posFilter");
      const directionFilter = document.getElementById("directionFilter");
      const statsEl = document.getElementById("statsText");

      const categories = Array.from(
        new Set(dictionary.map((e) => e.pos).filter(Boolean))
      ).sort((a, b) => a.localeCompare(b));

      for (const cat of categories) {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        posFilter.appendChild(opt);
      }

      function normalize(str) {
        return (str || "").toLowerCase().trim();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function matchesQuery(enText, mrText, extraText, q, dir) {
        if (!q) return true;
        const enMatch = normalize(enText).includes(q);
        const mrMatch = normalize(mrText).includes(q);
        const exMatch = normalize(extraText).includes(q);
        if (dir === "MARA") return mrMatch;
        if (dir === "ENGLISH") return enMatch;
        return enMatch || mrMatch || exMatch;
      }

      function renderDictionary(q, dir) {
        const gridEl = document.getElementById("dictionaryGrid");
        const emptyEl = document.getElementById("empty-dictionary");
        const selectedPos = posFilter.value;

        const filtered = dictionary.filter((item) => {
          if (selectedPos !== "ALL" && item.pos !== selectedPos) return false;
          return matchesQuery(item.en, item.mr, item.notes, q, dir);
        });

        if (filtered.length === 0) {
          gridEl.innerHTML = "";
          emptyEl.style.display = "block";
          return 0;
        }

        emptyEl.style.display = "none";
        const frag = document.createDocumentFragment();
        for (const item of filtered) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="card-top">
              <div class="mara-word">${escapeHtml(item.mr)}</div>
              ${item.pos ? `<span class="pos-badge">${escapeHtml(item.pos)}</span>` : ""}
            </div>
            <div class="english-word">${escapeHtml(item.en)}</div>
            ${item.notes ? `<div class="notes">${escapeHtml(item.notes)}</div>` : ""}
          `;
          frag.appendChild(card);
        }
        gridEl.innerHTML = "";
        gridEl.appendChild(frag);
        return filtered.length;
      }

      function renderTranslations(q, dir) {
        const listEl = document.getElementById("translationsList");
        const emptyEl = document.getElementById("empty-translations");

        const combined = [
          ...appTranslations.map((t) => ({
            badge: `App Log${t.direction ? ` · ${t.direction}` : ""}`,
            en: t.direction === "MR -> EN" ? t.output : t.input,
            mr: t.direction === "MR -> EN" ? t.input : t.output,
            meta: t.timestamp ? `Timestamp: ${t.timestamp}` : "App Translations",
            notes: t.notes
          })),
          ...translationsExamples.map((ex) => ({
            badge: ex.direction || "Example",
            en: ex.en,
            mr: ex.mr,
            meta: ex.source || "",
            notes: ex.notes
          }))
        ];

        const filtered = combined.filter((item) =>
          matchesQuery(item.en, item.mr, `${item.meta} ${item.notes}`, q, dir)
        );

        if (filtered.length === 0) {
          listEl.innerHTML = "";
          emptyEl.style.display = "block";
          return 0;
        }

        emptyEl.style.display = "none";
        const frag = document.createDocumentFragment();
        for (const item of filtered) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="card-top">
              <div class="mara-word">${escapeHtml(item.mr)}</div>
              <span class="pos-badge">${escapeHtml(item.badge)}</span>
            </div>
            <div class="english-word">${escapeHtml(item.en)}</div>
            ${item.meta ? `<div class="meta-line">${escapeHtml(item.meta)}</div>` : ""}
            ${item.notes ? `<div class="notes">${escapeHtml(item.notes)}</div>` : ""}
          `;
          frag.appendChild(card);
        }
        listEl.innerHTML = "";
        listEl.appendChild(frag);
        return filtered.length;
      }

      function renderGrammar(q, dir) {
        const listEl = document.getElementById("grammarList");
        const emptyEl = document.getElementById("empty-grammar");

        const filtered = grammar.filter((item) =>
          matchesQuery(
            `${item.category} ${item.rule} ${item.explanation}`,
            item.example,
            `${item.category} ${item.rule} ${item.explanation}`,
            q,
            dir
          )
        );

        if (filtered.length === 0) {
          listEl.innerHTML = "";
          emptyEl.style.display = "block";
          return 0;
        }

        emptyEl.style.display = "none";
        const frag = document.createDocumentFragment();
        for (const item of filtered) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="card-top">
              <div class="mara-word">${escapeHtml(item.category)}</div>
              <span class="pos-badge">Grammar / Morphology</span>
            </div>
            <div class="english-word">${escapeHtml(item.rule)}</div>
            ${item.example ? `<div class="meta-line"><strong>Example:</strong> ${escapeHtml(item.example)}</div>` : ""}
            ${item.explanation ? `<div class="notes">${escapeHtml(item.explanation)}</div>` : ""}
          `;
          frag.appendChild(card);
        }
        listEl.innerHTML = "";
        listEl.appendChild(frag);
        return filtered.length;
      }

      function renderReih(q, dir) {
        const listEl = document.getElementById("reihList");
        const emptyEl = document.getElementById("empty-reih");

        const filtered = reihMachapaBiephoh.filter((item) =>
          matchesQuery(
            `${item.literal} ${item.english} ${item.context}`,
            item.mara,
            `${item.literal} ${item.english} ${item.context}`,
            q,
            dir
          )
        );

        if (filtered.length === 0) {
          listEl.innerHTML = "";
          emptyEl.style.display = "block";
          return 0;
        }

        emptyEl.style.display = "none";
        const frag = document.createDocumentFragment();
        for (const item of filtered) {
          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
            <div class="card-top">
              <div class="mara-word">${escapeHtml(item.mara)}</div>
              <span class="pos-badge">${escapeHtml(item.type)}</span>
            </div>
            <div class="english-word">${escapeHtml(item.english)}</div>
            <div class="meta-line"><strong>Literal:</strong> ${escapeHtml(item.literal)}</div>
            ${item.context ? `<div class="notes">${escapeHtml(item.context)}</div>` : ""}
          `;
          frag.appendChild(card);
        }
        listEl.innerHTML = "";
        listEl.appendChild(frag);
        return filtered.length;
      }

      function renderAll() {
        const q = normalize(searchInput.value);
        const dir = directionFilter.value;
        clearBtn.classList.toggle("visible", searchInput.value.length > 0);

        const dictCount = renderDictionary(q, dir);
        const transCount = renderTranslations(q, dir);
        const gramCount = renderGrammar(q, dir);
        const reihCount = renderReih(q, dir);

        const totalAll =
          dictionary.length +
          appTranslations.length +
          translationsExamples.length +
          grammar.length +
          reihMachapaBiephoh.length;

        const currentCount =
          activeTab === "dictionary"
            ? dictCount
            : activeTab === "translations"
            ? transCount
            : activeTab === "grammar"
            ? gramCount
            : reihCount;

        statsEl.textContent = `${currentCount} in view · ${totalAll} total items (${dictionary.length} dictionary, ${appTranslations.length + translationsExamples.length} translations/examples, ${grammar.length} grammar, ${reihMachapaBiephoh.length} Reih machâpa/Biephôh)`;
      }

      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeTab = btn.getAttribute("data-tab");
          document.querySelectorAll(".tab-btn").forEach((b) =>
            b.classList.toggle("active", b === btn)
          );
          document.querySelectorAll(".section-panel").forEach((panel) =>
            panel.classList.toggle("active", panel.id === `panel-${activeTab}`)
          );
          renderAll();
        });
      });

      searchInput.addEventListener("input", renderAll);
      posFilter.addEventListener("change", renderAll);
      directionFilter.addEventListener("change", renderAll);

      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        renderAll();
        searchInput.focus();
      });

      document.querySelectorAll(".char-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const ch = btn.getAttribute("data-char");
          const start = searchInput.selectionStart ?? searchInput.value.length;
          const end = searchInput.selectionEnd ?? searchInput.value.length;
          const val = searchInput.value;
          searchInput.value = val.slice(0, start) + ch + val.slice(end);
          const nextPos = start + ch.length;
          searchInput.focus();
          searchInput.setSelectionRange(nextPos, nextPos);
          renderAll();
        });
      });

      renderAll();
    })();
  </script>
</body>
</html>
