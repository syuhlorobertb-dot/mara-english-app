<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mara-English Offline AI Dictionary &amp; Translator</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }
    .app {
      max-width: 780px;
      margin: 0 auto;
    }
    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      color: var(--accent);
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .panel.active { display: block; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .stats {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .entry {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mara-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-2);
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--accent);
    }
    .eng-text {
      margin-top: 4px;
      font-size: 0.98rem;
    }
    .meta {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    button.action-btn {
      margin-top: 10px;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent-2);
      color: #052e16;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .output-box {
      margin-top: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Mara–English Offline AI</h1>
      <p>100% offline dictionary, phrasebook &amp; smart lookup (preserves diacritics: ô, â, y).</p>
    </header>

    <div class="tabs">
      <button id="tabBtnDict" type="button" class="tab-btn active" onclick="switchTab('dict')">Dictionary &amp; Phrases</button>
      <button id="tabBtnHelper" type="button" class="tab-btn" onclick="switchTab('helper')">Phrase &amp; Word Helper</button>
    </div>

    <section id="dict" class="panel active">
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Search Mara or English (e.g., water, ti, samaw, tomato)..." oninput="renderEntries()" />
        <select id="categoryFilter" onchange="renderEntries()">
          <option value="ALL">All Categories</option>
        </select>
      </div>
      <div id="resultCount" class="stats"></div>
      <div id="entriesList"></div>
    </section>

    <section id="helper" class="panel">
      <p class="stats">Enter a word or short phrase in English or Mara to find exact matches, phrasebook lines, and word-by-word offline matches.</p>
      <textarea id="helperInput" rows="3" placeholder="Type here... e.g., Good night or Na pha ma"></textarea>
      <button type="button" class="action-btn" onclick="runHelper()">Translate / Match Offline</button>
      <div id="helperOutput" class="output-box">Matches will appear here.</div>
    </section>
  </div>

    function normalizeText(str) {
      var s = (str || "").toLowerCase();
      if (s.normalize) {
        s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }
      return s
        .replace(/ô/g, "o")
        .replace(/â/g, "a")
        .replace(/^\s+|\s+$/g, "");
    }

    function populateCategories() {
      var select = document.getElementById("categoryFilter");
      var seen = {};
      var cats = [];
      for (var i = 0; i < DATA.length; i++) {
        var c = DATA[i].cat;
        if (c && !seen[c]) {
          seen[c] = true;
          cats.push(c);
        }
      }
      cats.sort();
      for (var j = 0; j < cats.length; j++) {
        var opt = document.createElement("option");
        opt.value = cats[j];
        opt.appendChild(document.createTextNode(cats[j]));
        select.appendChild(opt);
      }
    }

    function renderEntries() {
      var searchEl = document.getElementById("searchInput");
      var catEl = document.getElementById("categoryFilter");
      var countEl = document.getElementById("resultCount");
      var listEl = document.getElementById("entriesList");

      var q = normalizeText(searchEl.value);
      var cat = catEl.value;
      var filtered = [];

      for (var i = 0; i < DATA.length; i++) {
        var item = DATA[i];
        var matchesCat = (cat === "ALL" || item.cat === cat);
        var matchesQuery =
          !q ||
          normalizeText(item.en).indexOf(q) !== -1 ||
          normalizeText(item.mara).indexOf(q) !== -1 ||
          normalizeText(item.cat).indexOf(q) !== -1;

        if (matchesCat && matchesQuery) {
          filtered.push(item);
        }
      }

      countEl.textContent = "Showing " + filtered.length + " of " + DATA.length + " offline entries";
      listEl.innerHTML = "";

      for (var k = 0; k < filtered.length; k++) {
        var entryItem = filtered[k];

        var card = document.createElement("div");
        card.className = "entry";

        var top = document.createElement("div");
        top.className = "entry-top";

        var maraSpan = document.createElement("span");
        maraSpan.className = "mara-text";
        maraSpan.appendChild(document.createTextNode(entryItem.mara));

        var badgeSpan = document.createElement("span");
        badgeSpan.className = "badge";
        badgeSpan.appendChild(document.createTextNode(entryItem.cat + " • " + entryItem.type));

        top.appendChild(maraSpan);
        top.appendChild(badgeSpan);

        var engDiv = document.createElement("div");
        engDiv.className = "eng-text";
        engDiv.appendChild(document.createTextNode(entryItem.en));

        card.appendChild(top);
        card.appendChild(engDiv);

        if (entryItem.note) {
          var metaDiv = document.createElement("div");
          metaDiv.className = "meta";
          metaDiv.appendChild(document.createTextNode(entryItem.note));
          card.appendChild(metaDiv);
        }

        listEl.appendChild(card);
      }
    }

    function switchTab(tabId) {
      var dictBtn = document.getElementById("tabBtnDict");
      var helperBtn = document.getElementById("tabBtnHelper");
      var dictPanel = document.getElementById("dict");
      var helperPanel = document.getElementById("helper");

      if (tabId === "dict") {
        dictBtn.className = "tab-btn active";
        helperBtn.className = "tab-btn";
        dictPanel.className = "panel active";
        helperPanel.className = "panel";
      } else {
        dictBtn.className = "tab-btn";
        helperBtn.className = "tab-btn active";
        dictPanel.className = "panel";
        helperPanel.className = "panel active";
      }
    }

    function runHelper() {
      var raw = document.getElementById("helperInput").value.replace(/^\s+|\s+$/g, "");
      var out = document.getElementById("helperOutput");
      if (!raw) {
        out.textContent = "Please type a word or phrase first.";
        return;
      }

      var normInput = normalizeText(raw);
      var directMatches = [];

      for (var i = 0; i < DATA.length; i++) {
        var item = DATA[i];
        if (
          normalizeText(item.en).indexOf(normInput) !== -1 ||
          normalizeText(item.mara).indexOf(normInput) !== -1
        ) {
          directMatches.push(item);
        }
      }

      var tokens = normInput.split(/[^a-z0-9]+/);
      var tokenMatches = [];

      for (var t = 0; t < tokens.length; t++) {
        var tok = tokens[t];
        if (!tok) continue;

        for (var w = 0; w < DATA.length; w++) {
          var wordEntry = DATA[w];
          if (wordEntry.type !== "word") continue;

          var enParts = normalizeText(wordEntry.en).split(/[\s,\/]+/);
          var maraParts = normalizeText(wordEntry.mara).split(/[\s,\/]+/);

          var foundInEn = false;
          var foundInMara = false;

          for (var e = 0; e < enParts.length; e++) {
            if (enParts[e] === tok) {
              foundInEn = true;
              break;
            }
          }
          for (var m = 0; m < maraParts.length; m++) {
            if (maraParts[m] === tok) {
              foundInMara = true;
              break;
            }
          }

          if (foundInEn || foundInMara) {
            tokenMatches.push(tok + " -> " + wordEntry.mara + " (" + wordEntry.en + ")");
            break;
          }
        }
      }

      var lines = [];
      if (directMatches.length > 0) {
        lines.push("Direct / Phrase Matches:");
        var maxDirect = directMatches.length < 8 ? directMatches.length : 8;
        for (var d = 0; d < maxDirect; d++) {
          var dm = directMatches[d];
          lines.push("• " + dm.en + "  =>  " + dm.mara + " [" + dm.cat + "]");
        }
      } else {
        lines.push("No direct phrase match found in v1 offline data.");
      }

      if (tokenMatches.length > 0) {
        lines.push("");
        lines.push("Word-by-Word Lookup:");
        for (var tm = 0; tm < tokenMatches.length; tm++) {
          lines.push("• " + tokenMatches[tm]);
        }
      }

      out.textContent = lines.join("\n");
    }

    populateCategories();
    renderEntries();
  </script>
</body>
</html>
