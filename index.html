<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mara–English Offline AI Dictionary & Translator</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
    }
    .app {
      max-width: 780px;
      margin: 0 auto;
    }
    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      color: var(--accent);
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .panel.active { display: block; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .stats {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .entry {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mara-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-2);
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--accent);
    }
    .eng-text {
      margin-top: 4px;
      font-size: 0.98rem;
    }
    .meta {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    button.action-btn {
      margin-top: 10px;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent-2);
      color: #052e16;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .output-box {
      margin-top: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Mara–English Offline AI</h1>
      <p>100% offline dictionary, phrasebook & smart lookup (preserves diacritics: ô, â, y).</p>
    </header>

      <button class="tab-btn active" onclick="switchTab('dict')">Dictionary & Phrases</button>
